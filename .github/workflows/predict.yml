name: Predict

on:
  schedule:
    - cron: "0 12 * * *"  # diario 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar resultados (incremental)
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python -m src.fetch_data

      - name: Generar predicciones
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python -m src.predict

      - name: Subir predicciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: predictions/

      - name: Commitear dataset y predicciones
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ predictions/
          git diff --cached --quiet || git commit -m "chore: predicciones diarias [skip ci]"
          git push
